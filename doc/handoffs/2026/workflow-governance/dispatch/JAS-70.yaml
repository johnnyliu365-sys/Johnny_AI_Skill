ticket: "modules/tickets/workflow-governance/70-wave2-template-and-hygiene.md (revision01)"
role: "implementation_seat"
profile: "implementation-standard"
summary: "the ticket template gains the rows review requires, INTEGRATED and one receipt per closure revision; the receipt template gains a RETURN cell; a test caps tracked paths at 120 characters"
worktree: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/70-templates (branch cp/wave3-70-templates; HEAD must be the commit named in base; git status --porcelain empty before you start)"
base: "96f095a900bf8b6efc554816461dfb1180a7f764"
ticket_leaf: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/70-templates/modules/tickets/workflow-governance/70-wave2-template-and-hygiene.md"
read_first:
  - "ticket_leaf in full"
  - "template/modules/tickets/TEMPLATE.md, template/doc/handoffs/governance/RECEIPT.TEMPLATE.md, template/README.md and tests/test_state_file_templates.py, read inside the worktree"
  - "skills/johnny-project-takeover/references/review-checks.md, the section Ticket dispatch schema review, and the Defect categories table"
env:
  python: "C:/Temp/claude/jas-venv/Scripts/python.exe"
  PYTHONUTF8: "1"
  pytest_rule: "one pytest at a time in this worktree; the full suite only under the host lock; no mutation worker of yours runs while you hold the lock; stay in your turn while you wait for the lock or for CI"
  host_lock: "C:/Temp/claude/jas-fullsuite.lock: mkdir to acquire, write owner.txt with your run id; release by renaming the directory to a unique name, then removing it, only if owner.txt still names your run id; stale after 45 minutes"
  p1_tests: "tests/test_state_file_templates.py tests/test_tracked_path_length.py tests/test_gate_evidence.py tests/test_wave2_end_to_end.py"
  mutations: "the INTEGRATED state removed; the stale section citation restored; the cap raised to 160; bytes counted instead of characters"
  out_dir: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/70-templates-out (receipt and captures; LF; build each raw block by reading its capture file)"
  scratch: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/70-templates-scratch (disposable clones and temporary files)"
  residue: "every directory, clone, lock and process you start carries your run id in its name; before you return remove what carries your run id and list it in the STATEMENT; never remove anything that does not carry it"
  identity: "commit as Johnny Liu <johnny.liu365@gmail.com>"
writable:
  - "the paths in the ticket's boundary block inside the worktree"
prohibited:
  - "any other path; skipping, deleting or weakening any test beyond what the ticket states; rebase, amend, reset or force; force push; Any; type: ignore"
  - "pushing any branch other than cp/wave3-70-templates; reading or adding secrets"
  - "asking the owner questions; return CHANGE_DETECTED with the evidence where the ticket says so; start no process you cannot stop"
contracts:
  - "every row of the ticket; each existing template pin unchanged apart from the state-list and heading pins, each named in the STATEMENT"
  - "the receipt template with a real capture, a USAGE cell and a RETURN cell passes evidence_gate.py; if the gate refuses RETURN, that is a CHANGE_DETECTED return"
  - "push this branch to run CI; additive commits until one commit has both jobs success"
  - "before committing run python -m pytest tests/test_plugin_payload_boundary.py (only CommittedPinTests::test_the_pinned_sha_exists may fail)"
cells:
  - id: "P1"
    cmd: "python -m pytest <p1_tests> -q -rfEs -p no:cacheprovider > <out_dir>/P1.txt 2>&1; echo exit=$? >> <out_dir>/P1.txt"
    assert: "exit=0"
  - id: "T1"
    cmd: "python -m mypy --strict --python-version 3.11 tests/test_state_file_templates.py tests/test_tracked_path_length.py > <out_dir>/T1.txt 2>&1; echo exit=$? >> <out_dir>/T1.txt"
    assert: "exit=0"
  - id: "M1"
    cmd: "mutations in a disposable git clone --no-hardlinks copy under scratch (record the clone command in the capture), each run with its full test file (not -x) and its pytest command recorded, diff and unfiltered output appended to <out_dir>/M1.txt, restored, porcelain empty: each of <mutations>"
    assert: "every mutation red, or marked equivalent with a reason"
  - id: "C1"
    cmd: "gh run view <run id> --json headSha,conclusion,jobs,url > <out_dir>/C1.txt 2>&1; echo exit=$? >> <out_dir>/C1.txt"
    assert: "both jobs conclusion success on the receipt's candidate sha"
  - id: "F1"
    cmd: "python -m pytest tests -q -p no:cacheprovider > <out_dir>/F1.txt 2>&1; echo exit=$? >> <out_dir>/F1.txt"
    assert: "failure set a subset of the base names in C:/Temp/claude/jas48_F1_base.txt; zero new red; every other pytest running at acquisition named in the STATEMENT"
  - id: "P9"
    cmd: "python -I -X utf8 C:/Users/User/Desktop/Johnny_AI_Skill/doc/reviews/workflow-governance/evidence/48/receipt_check.py <out_dir>/RETURN.md <worktree>"
    assert: "exit=0; the P9 capture is the checker run on the receipt without its P9 section, LF; then rebuild the receipt with that section"
  - id: "E1"
    cmd: "python -I -X utf8 skills/johnny-project-takeover/scripts/evidence_gate.py <out_dir>/RETURN.md --repo <worktree> --candidate <commit sha> --tool skills/johnny-project-takeover/scripts/evidence_gate.py --tool skills/johnny-project-takeover/scripts/index_pins.py --evidence-root <out_dir> --require-cell P1 --require-cell T1 --require-cell M1 --require-cell F1"
    assert: "exit=0 on the receipt as returned; E1 runs last"
commits:
  - "feat(template): ticket and receipt template follow-ups from wave 2; tracked-path length cap (ticket 70), with additive commits while CI is read back"
  - "last line of each: a Co-Authored-By trailer naming the model that actually did the work, with <noreply@anthropic.com>"
receipt:
  path: "<out_dir>/RETURN.md"
  rule: "R4-7 cells; tool_digest: the scripts named in E1 at the last commit; every cell runs at the last commit; exit in capture order; raw block equal to the file; one F1 cell; STATEMENT section naming every new or changed template row, every changed assertion, and the longest tracked path at the base"
return:
  - "report only: receipt path, last commit sha, CI run id and URL, per-cell exit, PROCESSES_LEFT=0, BLOCKED or CHANGE_DETECTED items"
  - "do not merge, do not remove the worktree; push only this ticket's branch"
timebox: "180 minutes"
