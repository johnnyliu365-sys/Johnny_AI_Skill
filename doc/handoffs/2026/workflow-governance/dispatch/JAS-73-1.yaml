summary: "every code-review section ends with a rework-record block whose causes follow from the finding classes, a report sums rounds and causes per ticket, and ten wave-3 records are backfilled"
worktree: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/73-rework (branch cp/wave3-73-rework)"
worktree_check: "HEAD equals base and git status --porcelain is empty before you start"
base: "50b4685e027c294fcac638f1d693c03be2bb0fb6"
