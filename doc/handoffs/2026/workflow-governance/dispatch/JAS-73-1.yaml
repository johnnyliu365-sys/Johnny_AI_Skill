env:
  python: "C:/Temp/claude/jas-venv/Scripts/python.exe"
  PYTHONUTF8: "1"
  pytest_rule: "one pytest at a time in this worktree"
  full_suite_rule: "the full suite only under the host lock, with no mutation worker of yours running while you hold it"
  wait_rule: "stay in your turn while you wait for the lock or for CI"
  host_lock_acquire: "C:/Temp/claude/jas-fullsuite.lock: mkdir to acquire, then write owner.txt with your run id"
  host_lock_release: "rename the lock directory to a unique name and remove it, only if owner.txt still names your run id"
  host_lock_stale: "a lock older than 45 minutes is stale"
  p1_tests: "tests/test_rework_report.py tests/test_integrate.py tests/test_gate_contract.py"
  out_dir: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/73-rework-out (receipt and captures, LF, each raw block built by reading its capture file)"
  scratch: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/73-rework-scratch (disposable clones and temporary files)"
  residue: "every directory, clone, lock and process you start carries your run id in its name"
  residue_cleanup: "before you return, remove what carries your run id and list it in the STATEMENT"
  residue_limit: "never remove anything that does not carry your run id"
  identity: "commit as Johnny Liu <johnny.liu365@gmail.com>"
writable:
  - "the paths in the ticket's boundary block, inside the worktree"
prohibited:
  - "any other path"
  - "skipping, deleting or weakening any test beyond what the ticket states"
  - "rebase, amend, reset, force or force push"
  - "Any or type: ignore"
  - "pushing any branch other than cp/wave3-73-rework"
  - "reading or adding secrets"
  - "asking the owner questions (return CHANGE_DETECTED with the evidence where the ticket says so)"
  - "starting a process you cannot stop"
contracts:
  - "the block grammar, the cause mapping, the report lines, the reds and the exit codes work exactly as items 1 to 4 state"
  - "the backfill writes blocks into the ten records item 5 names and changes no finding, and the two RETURN blocks of tickets 65 and 70 stand before the first review section"
  - "the O1 observation runs the report over the ten backfilled records and gives exit 0"
  - "push this branch to run CI"
  - "add commits until one commit has both CI jobs success and no UNREGISTERED_FAILURE or REGISTERED_NOT_FAILING in either log"
cells:
  - id: "P1"
    cmd: "python -m pytest <p1_tests> -q -rfEs -p no:cacheprovider > <out_dir>/P1.txt 2>&1; echo exit=$? >> <out_dir>/P1.txt"
    assert: "exit=0 (no registered base failure is in this test file)"
  - id: "T1"
    cmd: "python -m mypy --strict --python-version 3.11 skills/johnny-project-takeover/scripts/rework_report.py tests/test_rework_report.py > <out_dir>/T1.txt 2>&1; echo exit=$? >> <out_dir>/T1.txt"
    assert: "exit=0"
  - id: "M1"
    cmd: "mutations in a disposable `git clone --no-hardlinks` copy under scratch, each run with its full test file (not -x), diff and unfiltered output appended to <out_dir>/M1.txt, then restored with porcelain empty"
    mutations:
      - "accept an unknown cause"
      - "accept causes on an APPROVED round"
      - "let a fault suppress the reds"
      - "accept a skipped round"
      - "skip the cross-check against review-verdict"
    assert: "every mutation red, or marked equivalent with a reason"
  - id: "C1"
    cmd: "gh run view <run id> --json headSha,conclusion,jobs,url > <out_dir>/C1.txt 2>&1; echo exit=$? >> <out_dir>/C1.txt"
    assert: "both jobs conclusion success on the receipt's candidate sha"
  - id: "F1"
    cmd: "python -m pytest tests -q -p no:cacheprovider > <out_dir>/F1.txt 2>&1; echo exit=$? >> <out_dir>/F1.txt"
    assert: "the failure set is a subset of these registered base failures: tests/test_atomic_conditional_replace_capability.py::test_acr2_linux_requires_an_actual_linux_kernel_and_backend, tests/test_plugin_payload_boundary.py::CommittedPinTests::test_the_pinned_sha_exists, tests/test_plugin_publication.py::CandidateMetadataTests::test_l5_stale_candidate_pin_is_named_before_generation, tests/test_plugin_publication.py::PublicationReachabilityTests::test_deleting_the_actual_publication_anchor_makes_the_marketplace_pin_unreachable, tests/test_plugin_publication.py::PublicationReachabilityTests::test_the_marketplace_pin_is_bound_to_the_actual_publication_anchor (the list in C:/Temp/claude/jas48_F1_base.txt, zero new red, and every other pytest running at acquisition named in the STATEMENT"
  - id: "P9"
    cmd: "python -I -X utf8 C:/Users/User/Desktop/Johnny_AI_Skill/doc/reviews/workflow-governance/evidence/48/receipt_check.py <out_dir>/RETURN.md <worktree>"
    assert: "exit=0 (the capture is the checker run on the receipt without its P9 section, LF, after which the receipt is rebuilt with that section)"
  - id: "E1"
    cmd: "python -I -X utf8 skills/johnny-project-takeover/scripts/evidence_gate.py <out_dir>/RETURN.md --repo <worktree> --candidate <commit sha> --tool skills/johnny-project-takeover/scripts/index_pins.py --tool skills/johnny-project-takeover/scripts/receipt_fence_check.py --evidence-root <out_dir> --require-cell P1 --require-cell T1 --require-cell M1 --require-cell F1"
    assert: "exit=0 on the receipt as returned, and E1 runs last"
commits:
  - "`feat(gates): rework-record block and rework_report; wave-3 records backfilled (ticket 73)`, with additive commits while CI is read back"
  - "last line of each commit: a Co-Authored-By trailer naming the model that actually did the work, with <noreply@anthropic.com>"
receipt:
  path: "<out_dir>/RETURN.md"
  cells_rule: "R4-7 cells, every cell at the last commit, exit in capture order, raw block equal to the file, one F1 cell"
  tool_digest_rule: "tool_digest is taken from the scripts named in E1 at the last commit"
  statement_first_lines: "`return: COMPLETED` (or BLOCKED or CHANGE_DETECTED), then `items:` with the count of STATEMENT items"
  statement_items:
    - "each red and output line with its exit"
    - "the ten backfilled blocks, each with the findings it was derived from"
    - "every finding whose class was hard to map"
    - "the O1 output"
    - "the residue removed and anything left, with the reason"
return:
  - "report only: receipt path, last commit sha, CI run id and URL, per-cell exit, PROCESSES_LEFT=0, and any BLOCKED or CHANGE_DETECTED items"
  - "do not merge, and do not remove the worktree"
  - "push only this ticket's branch"
timebox: "180 minutes"
